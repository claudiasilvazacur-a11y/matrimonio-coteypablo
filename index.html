<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrimonio Pablo y María José — Álbum de Fotos</title>
  <!-- Tipografías inspiradas en la invitación -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-crema: #FDF7F7;
      --rosa-suave: #F6E2E6;
      --rosa-borde: #EBC9D0;
      --rosa-principal: #D48195;
      --rosa-oscuro: #B86277;
      --salvia: #8FA691;
      --salvia-oscuro: #738C75;
      --texto-oscuro: #2C2A29;
      --texto-suave: #6D6566;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      text-align: center;
      padding: 16px;
      background-color: var(--bg-crema);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(244, 198, 208, 0.28) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(244, 198, 208, 0.28) 0%, transparent 40%);
      color: var(--texto-oscuro);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Decoración floral de esquinas */
    .sakura-corner {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }
    .sakura-top-right { top: -10px; right: -10px; width: 170px; }
    .sakura-bottom-left { bottom: -10px; left: -10px; width: 170px; transform: rotate(180deg); }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      padding: 32px 24px;
      border-radius: 20px;
      border: 1.5px solid var(--rosa-borde);
      box-shadow: 0 12px 32px rgba(184, 98, 119, 0.10);
      max-width: 440px;
      width: 100%;
      margin: 15px auto;
    }

    /* Marco interior estilo tarjeta de boda */
    .card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(235, 201, 208, 0.55);
      border-radius: 14px;
      pointer-events: none;
    }

    .cat-header {
      margin: 0 auto 6px;
      width: 110px;
      height: 68px;
    }

    .nombres-novios {
      font-family: 'Great Vibes', cursive;
      font-size: 44px;
      font-weight: 400;
      color: var(--texto-oscuro);
      margin: 4px 0 0;
      line-height: 1.1;
    }

    .subtitulo-boda {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--rosa-oscuro);
      margin: 4px 0 12px;
      text-transform: uppercase;
    }

    .instruccion {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: var(--texto-suave);
      line-height: 1.4;
      margin: 0 0 18px;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0 18px;
      color: var(--rosa-principal);
      font-size: 14px;
    }
    .divider::before, .divider::after {
      content: "";
      height: 1px;
      width: 55px;
      background: linear-gradient(90deg, transparent, var(--rosa-borde), transparent);
    }

    input[type="file"] { display: none; }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
      position: relative;
      z-index: 2;
    }

    .btn {
      background: var(--rosa-principal);
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      box-shadow: 0 4px 12px rgba(212, 129, 149, 0.25);
      transition: all 0.2s ease;
    }
    .btn:hover { background: var(--rosa-oscuro); transform: translateY(-1px); }

    .btn-salvia {
      background: var(--salvia);
      box-shadow: 0 4px 12px rgba(143, 166, 145, 0.25);
    }
    .btn-salvia:hover { background: var(--salvia-oscuro); }

    .btn-dark {
      background: #4A4445;
      box-shadow: 0 4px 12px rgba(74, 68, 69, 0.2);
    }
    .btn-dark:hover { background: #332E2F; }

    .btn-outline {
      background: rgba(255, 255, 255, 0.8);
      color: var(--rosa-oscuro);
      border: 1.5px solid var(--rosa-borde);
      box-shadow: none;
    }
    .btn-outline:hover {
      background: var(--rosa-suave);
      border-color: var(--rosa-principal);
    }

    .btn-upload-now {
      background: linear-gradient(135deg, #D48195 0%, #B86277 100%);
      font-size: 16px;
      padding: 15px;
      box-shadow: 0 6px 16px rgba(184, 98, 119, 0.35);
    }

    .btn.disabled {
      background: #D8CFD1;
      pointer-events: none;
      box-shadow: none;
    }

    /* Cuadrícula de previsualización */
    .preview-section { display: none; margin-top: 20px; text-align: left; position: relative; z-index: 2; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: 700; color: var(--texto-suave); }
    .btn-limpiar { background: none; border: none; color: var(--rosa-oscuro); font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; font-family: 'Nunito', sans-serif; }
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .preview-item { position: relative; width: 100%; padding-top: 100%; border-radius: 10px; overflow: hidden; background: var(--rosa-suave); border: 1.5px solid var(--rosa-borde); }
    .preview-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .btn-remove { position: absolute; top: 4px; right: 4px; background: rgba(44, 42, 41, 0.78); color: white; border: none; width: 24px; height: 24px; border-radius: 50%; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .btn-remove:hover { background: var(--rosa-oscuro); }

    /* Barra de progreso */
    .progress-container { display: none; width: 100%; background: var(--rosa-suave); border-radius: 10px; overflow: hidden; height: 10px; margin-top: 18px; position: relative; z-index: 2; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--rosa-principal), var(--salvia)); transition: width 0.25s ease; }

    #estado { margin-top: 14px; font-weight: 700; line-height: 1.5; word-break: break-word; font-size: 15px; color: var(--texto-oscuro); position: relative; z-index: 2; }
    .error-box { background: #FFF0F2; color: #A63A50; border: 1px solid #EBC0C8; padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 12px; text-align: left; font-family: monospace; position: relative; z-index: 2; }

    .footer-paw {
      margin-top: 18px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--texto-suave);
    }
  </style>
</head>

    <h1 class="nombres-novios">Pablo y María José</h1>
    <div class="subtitulo-boda">Nuestro Álbum de Boda</div>
    
    <div class="divider">🐾</div>

    <p class="instruccion" id="subtitulo">Captura los mejores momentos de nuestra celebración o súbelos desde tu galería para compartirlos con nosotros.</p>
    
    <!-- Controles de captura y selección -->
    <div class="btn-group" id="controlesSeleccion">
      <label class="btn" id="btnCamara">
        📷 Tomar foto ahora
        <input type="file" id="archivoCamara" accept="image/*" capture="environment" onchange="agregarALaCola(this)">
      </label>

      <label class="btn btn-salvia" id="btnGaleria">
        🖼️ Elegir de la galería
        <input type="file" id="archivoGaleria" accept="image/*" multiple onchange="agregarALaCola(this)">
      </label>

      <a href="galeria.html" id="btnVerAlbumInicial" class="btn btn-outline" style="margin-top: 4px;">
        🌸 Ver álbum de recuerdos
      </a>
    </div>

    <!-- Vista previa de fotos listas para subir -->
    <div class="preview-section" id="seccionPreview">
      <div class="preview-header">
        <span id="contadorCola">Fotos listas (0)</span>
        <button type="button" class="btn-limpiar" onclick="vaciarCola()">Quitar todas</button>
      </div>
      
      <div class="preview-grid" id="gridPreview"></div>

      <button type="button" class="btn btn-upload-now" id="btnConfirmarSubida" onclick="subirColaCompleta()">
        💌 Subir fotos al álbum
      </button>
    </div>

    <!-- Barra de progreso y estado -->
    <div class="progress-container" id="barraContenedor">
      <div class="progress-bar" id="barraProgreso"></div>
    </div>
    <div id="estado"></div>
    <div id="detalleError" class="error-box" style="display: none;"></div>

    <!-- Opciones posteriores a la subida -->
    <div class="btn-group" id="opcionesPostSubida" style="display: none;">
      <button class="btn" onclick="reiniciarFormulario()">➕ Añadir más recuerdos</button>
      <a href="galeria.html" class="btn btn-dark">🌸 Ver galería completa</a>
    </div>

    <div class="footer-paw">Con cariño, Pablo, María José y sus gatitos 🐾</div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSjprB95VK-ywTb8fj1C9grSBJAL8L2amZ4GBZ5IigZduPtCMs-lBgivcYhLQBivlx/exec';
    const MAX_DIMENSION = 1600;
    const CALIDAD_JPEG = 0.72;
    const SUBIDAS_SIMULTANEAS = 3;

    let colaArchivos = [];

    window.addEventListener('DOMContentLoaded', () => {
      fetch(SCRIPT_URL).catch(() => {});
    });

    function agregarALaCola(input) {
      const archivos = Array.from(input.files);
      if (archivos.length === 0) return;

      archivos.forEach(file => {
        colaArchivos.push({
          file: file,
          previewUrl: URL.createObjectURL(file)
        });
      });

      input.value = '';
      renderizarVistaPrevia();
    }

    function eliminarDeCola(index) {
      URL.revokeObjectURL(colaArchivos[index].previewUrl);
      colaArchivos.splice(index, 1);
      renderizarVistaPrevia();
    }

    function vaciarCola() {
      colaArchivos.forEach(item => URL.revokeObjectURL(item.previewUrl));
      colaArchivos = [];
      renderizarVistaPrevia();
    }

    function renderizarVistaPrevia() {
      const seccionPreview = document.getElementById('seccionPreview');
      const gridPreview = document.getElementById('gridPreview');
      const contadorCola = document.getElementById('contadorCola');
      const btnConfirmar = document.getElementById('btnConfirmarSubida');
      const btnCamara = document.getElementById('btnCamara');
      const btnVerAlbumInicial = document.getElementById('btnVerAlbumInicial');

      gridPreview.innerHTML = '';

      if (colaArchivos.length === 0) {
        seccionPreview.style.display = 'none';
        btnCamara.childNodes[0].nodeValue = '📷 Tomar foto ahora ';
        btnVerAlbumInicial.style.display = 'flex';
        return;
      }

      btnCamara.childNodes[0].nodeValue = '📷 Tomar otra foto ';
      btnVerAlbumInicial.style.display = 'none';
      seccionPreview.style.display = 'block';

      contadorCola.innerText = `Fotos seleccionadas (${colaArchivos.length})`;
      btnConfirmar.innerText = colaArchivos.length === 1 
        ? '💌 Subir 1 foto al álbum' 
        : `💌 Subir ${colaArchivos.length} fotos al álbum`;

      colaArchivos.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'preview-item';

        const img = document.createElement('img');
        img.src = item.previewUrl;
        img.alt = `Vista previa ${index + 1}`;

        const btnDel = document.createElement('button');
        btnDel.type = 'button';
        btnDel.className = 'btn-remove';
        btnDel.innerHTML = '&times;';
        btnDel.setAttribute('aria-label', 'Eliminar foto');
        btnDel.onclick = () => eliminarDeCola(index);

        div.appendChild(img);
        div.appendChild(btnDel);
        gridPreview.appendChild(div);
      });
    }

    function reiniciarFormulario() {
      vaciarCola();
      document.getElementById('opcionesPostSubida').style.display = 'none';
      document.getElementById('controlesSeleccion').style.display = 'flex';
      document.getElementById('subtitulo').style.display = 'block';
      document.getElementById('barraContenedor').style.display = 'none';
      document.getElementById('barraProgreso').style.width = '0%';
      document.getElementById('estado').innerText = '';
      document.getElementById('detalleError').style.display = 'none';
    }

    async function subirColaCompleta() {
      if (colaArchivos.length === 0) return;

      const estado = document.getElementById('estado');
      const detalleError = document.getElementById('detalleError');
      const controlesSeleccion = document.getElementById('controlesSeleccion');
      const seccionPreview = document.getElementById('seccionPreview');
      const opcionesPostSubida = document.getElementById('opcionesPostSubida');
      const subtitulo = document.getElementById('subtitulo');
      const barraContenedor = document.getElementById('barraContenedor');
      const barraProgreso = document.getElementById('barraProgreso');

      controlesSeleccion.style.display = 'none';
      seccionPreview.style.display = 'none';
      subtitulo.style.display = 'none';
      detalleError.style.display = 'none';
      detalleError.innerText = '';
      
      barraContenedor.style.display = 'block';
      barraProgreso.style.width = '5%';

      const lote = [...colaArchivos];
      const total = lote.length;
      let completadas = 0;
      let errores = [];
      let indiceCola = 0;

      estado.innerText = `Guardando ${total} recuerdo(s)... 🌸`;

      async function trabajador() {
        while (indiceCola < total) {
          const idx = indiceCola++;
          const file = lote[idx].file;
          try {
            const base64Comprimido = await comprimirImagen(file);
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const baseName = file.name.replace(/\.[^/.]+$/, "");
            const nombreFinal = `${baseName}_${idx + 1}_${timestamp}.jpg`;

            const respuesta = await fetch(SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                base64Data: base64Comprimido,
                fileName: nombreFinal,
                mimeType: 'image/jpeg'
              })
            });

            const textoRespuesta = await respuesta.text();
            const resultado = JSON.parse(textoRespuesta);

            if (!resultado.exito) {
              throw new Error(resultado.error || 'Error en servidor.');
            }
          } catch (err) {
            errores.push(`${file.name}: ${err.message}`);
          } finally {
            completadas++;
            const porcentaje = Math.round((completadas / total) * 100);
            barraProgreso.style.width = `${porcentaje}%`;
            estado.innerText = `Subiendo: ${completadas} de ${total} (${porcentaje}%) 🌸`;
          }
        }
      }

      const numHilos = Math.min(SUBIDAS_SIMULTANEAS, total);
      const hilos = Array.from({ length: numHilos }, () => trabajador());
      await Promise.all(hilos);

      barraContenedor.style.display = 'none';

      if (errores.length > 0 && completadas === errores.length) {
        estado.innerText = `❌ No se pudieron subir las fotos.`;
        detalleError.style.display = 'block';
        detalleError.innerText = errores.join('\n');
        controlesSeleccion.style.display = 'flex';
        seccionPreview.style.display = 'block';
        return;
      }

      vaciarCola();

      const exitosas = total - errores.length;
      estado.innerText = `✨ ¡Muchas gracias! Se guardaron ${exitosas} recuerdo(s) en nuestro álbum.`;
      if (errores.length > 0) {
        detalleError.style.display = 'block';
        detalleError.innerText = `Algunas fotos fallaron:\n${errores.join('\n')}`;
      }
      opcionesPostSubida.style.display = 'flex';
    }

    function comprimirImagen(file) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        
        img.onload = function() {
          URL.revokeObjectURL(objectUrl);
          let width = img.width;
          let height = img.height;

          if (width > height && width > MAX_DIMENSION) {
            height = Math.round((height * MAX_DIMENSION) / width);
            width = MAX_DIMENSION;
          } else if (height > MAX_DIMENSION) {
            width = Math.round((width * MAX_DIMENSION) / height);
            height = MAX_DIMENSION;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL('image/jpeg', CALIDAD_JPEG));
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('No se pudo procesar la imagen.'));
        };

        img.src = objectUrl;
      });
    }
  </script>
