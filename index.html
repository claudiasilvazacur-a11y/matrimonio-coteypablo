<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Fotos al Álbum</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; color: #333; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
    input[type="file"] { display: none; }
    .btn { background: #4285F4; color: white; padding: 15px 25px; border-radius: 8px; cursor: pointer; display: inline-block; font-size: 16px; font-weight: bold; margin-top: 15px; transition: background 0.2s; }
    .btn.disabled { background: #a0c1f7; pointer-events: none; }
    #estado { margin-top: 20px; font-weight: bold; line-height: 1.5; word-break: break-word; }
    .error-box { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 13px; text-align: left; font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📸 Comparte tus fotos</h2>
    <p>Selecciona o toma una foto para subirla directamente al álbum.</p>
    <label class="btn" id="btnSubir">
      Elegir o tomar foto
      <input type="file" id="archivo" accept="image/*" multiple onchange="procesarArchivos()">
    </label>
    <div id="estado"></div>
    <div id="detalleError" class="error-box" style="display: none;"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxYokVKO1njGjW4DODaNbHepRmf-WjNYxJKcj2-aLwpS6efo6VgKGHhakG51JA1WcbY/exec';
    const MAX_DIMENSION = 1920;
    const CALIDAD_JPEG = 0.82;

    async function procesarArchivos() {
      const input = document.getElementById('archivo');
      const estado = document.getElementById('estado');
      const detalleError = document.getElementById('detalleError');
      const btn = document.getElementById('btnSubir');
      const archivos = Array.from(input.files);
      
      if (archivos.length === 0) return;
      
      btn.classList.add('disabled');
      detalleError.style.display = 'none';
      detalleError.innerText = '';
      let subidas = 0;

      for (const file of archivos) {
        try {
          estado.innerText = `Optimizando foto ${subidas + 1} de ${archivos.length}... 🔄`;
          const base64Comprimido = await comprimirImagen(file);
          
          estado.innerText = `Subiendo foto ${subidas + 1} de ${archivos.length}... ⏳`;
          const nombreFinal = file.name.replace(/\.[^/.]+$/, "") + ".jpg";

          const respuesta = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              base64Data: base64Comprimido,
              fileName: nombreFinal,
              mimeType: 'image/jpeg'
            })
          });

          const textoRespuesta = await respuesta.text();
          let resultado;

          try {
            resultado = JSON.parse(textoRespuesta);
          } catch (parseErr) {
            throw new Error(`Google no devolvió JSON (HTTP ${respuesta.status}). Respuesta recibida: ${textoRespuesta.substring(0, 200)}...`);
          }

          if (!resultado.exito) {
            throw new Error(resultado.error || 'Error desconocido en Apps Script.');
          }

          subidas++;
        } catch (err) {
          estado.innerText = `❌ Falló la subida de "${file.name}"`;
          detalleError.style.display = 'block';
          detalleError.innerText = `Detalle técnico:\n${err.message}`;
          btn.classList.remove('disabled');
          input.value = '';
          return;
        }
      }

      estado.innerText = `✅ ¡Listo! Se subieron ${subidas} foto(s) al álbum.`;
      input.value = '';
      btn.classList.remove('disabled');
    }

    function comprimirImagen(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            let width = img.width;
            let height = img.height;

            if (width > height && width > MAX_DIMENSION) {
              height = Math.round((height * MAX_DIMENSION) / width);
              width = MAX_DIMENSION;
            } else if (height > MAX_DIMENSION) {
              width = Math.round((width * MAX_DIMENSION) / height);
              height = MAX_DIMENSION;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', CALIDAD_JPEG));
          };
          img.onerror = () => reject(new Error('No se pudo leer la imagen en el navegador.'));
          img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error('Error al leer el archivo local.'));
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
