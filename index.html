<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Fotos al Álbum</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 16px; background: #f4f4f9; color: #333; margin: 0; }
    .card { background: white; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 440px; margin: 20px auto; }
    input[type="file"] { display: none; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
    .btn { background: #4285F4; color: white; padding: 14px 18px; border-radius: 8px; cursor: pointer; display: block; font-size: 16px; font-weight: bold; text-decoration: none; border: none; transition: background 0.2s; }
    .btn-green { background: #34A853; }
    .btn-dark { background: #202124; }
    .btn-outline { background: white; color: #4285F4; border: 2px solid #4285F4; }
    .btn-upload-now { background: #EA4335; font-size: 17px; padding: 16px; box-shadow: 0 4px 12px rgba(234,67,53,0.3); }
    .btn.disabled { background: #b0bec5; pointer-events: none; box-shadow: none; }

    /* Cuadrícula de previsualización antes de subir */
    .preview-section { display: none; margin-top: 20px; text-align: left; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; font-weight: bold; color: #555; }
    .btn-limpiar { background: none; border: none; color: #d93025; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; }
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .preview-item { position: relative; width: 100%; padding-top: 100%; border-radius: 8px; overflow: hidden; background: #eee; border: 1px solid #ddd; }
    .preview-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .btn-remove { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.75); color: white; border: none; width: 24px; height: 24px; border-radius: 50%; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .btn-remove:hover { background: #d93025; }

    /* Barra de progreso visual */
    .progress-container { display: none; width: 100%; background: #e0e0e0; border-radius: 8px; overflow: hidden; height: 12px; margin-top: 18px; }
    .progress-bar { height: 100%; width: 0%; background: #34A853; transition: width 0.25s ease; }
    
    #estado { margin-top: 14px; font-weight: bold; line-height: 1.5; word-break: break-word; font-size: 15px; }
    .error-box { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 13px; text-align: left; font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📸 Comparte tus fotos</h2>
    <p id="subtitulo">Toma varias fotos seguidas o elige de tu galería, revísalas y súbelas juntas.</p>
    
    <!-- Controles de captura y selección -->
    <div class="btn-group" id="controlesSeleccion">
      <label class="btn" id="btnCamara">
        📷 Tomar foto
        <input type="file" id="archivoCamara" accept="image/*" capture="environment" onchange="agregarALaCola(this)">
      </label>

      <label class="btn btn-green" id="btnGaleria">
        🖼️ Elegir de la galería
        <input type="file" id="archivoGaleria" accept="image/*" multiple onchange="agregarALaCola(this)">
      </label>

      <a href="galeria.html" id="btnVerAlbumInicial" class="btn btn-outline" style="margin-top: 4px;">👀 Ver álbum actual</a>
    </div>

    <!-- Vista previa de fotos listas para subir -->
    <div class="preview-section" id="seccionPreview">
      <div class="preview-header">
        <span id="contadorCola">Fotos listas (0)</span>
        <button type="button" class="btn-limpiar" onclick="vaciarCola()">Borrar todas</button>
      </div>
      
      <div class="preview-grid" id="gridPreview"></div>

      <button type="button" class="btn btn-upload-now" id="btnConfirmarSubida" onclick="subirColaCompleta()">
        🚀 Subir fotos al álbum
      </button>
    </div>

    <!-- Barra de progreso y estado -->
    <div class="progress-container" id="barraContenedor">
      <div class="progress-bar" id="barraProgreso"></div>
    </div>
    <div id="estado"></div>
    <div id="detalleError" class="error-box" style="display: none;"></div>

    <!-- Opciones posteriores a la subida -->
    <div class="btn-group" id="opcionesPostSubida" style="display: none;">
      <button class="btn" onclick="reiniciarFormulario()">➕ Añadir más archivos</button>
      <a href="galeria.html" class="btn btn-dark">🖼️ Ver galería</a>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSjprB95VK-ywTb8fj1C9grSBJAL8L2amZ4GBZ5IigZduPtCMs-lBgivcYhLQBivlx/exec';
    const MAX_DIMENSION = 1600;
    const CALIDAD_JPEG = 0.72;
    const SUBIDAS_SIMULTANEAS = 3;

    // Almacena objetos { file, previewUrl } antes de subir
    let colaArchivos = [];

    window.addEventListener('DOMContentLoaded', () => {
      fetch(SCRIPT_URL).catch(() => {});
    });

    function agregarALaCola(input) {
      const archivos = Array.from(input.files);
      if (archivos.length === 0) return;

      archivos.forEach(file => {
        colaArchivos.push({
          file: file,
          previewUrl: URL.createObjectURL(file)
        });
      });

      // Limpiar input para permitir volver a tomar otra foto inmediatamente
      input.value = '';
      renderizarVistaPrevia();
    }

    function eliminarDeCola(index) {
      URL.revokeObjectURL(colaArchivos[index].previewUrl);
      colaArchivos.splice(index, 1);
      renderizarVistaPrevia();
    }

    function vaciarCola() {
      colaArchivos.forEach(item => URL.revokeObjectURL(item.previewUrl));
      colaArchivos = [];
      renderizarVistaPrevia();
    }

    function renderizarVistaPrevia() {
      const seccionPreview = document.getElementById('seccionPreview');
      const gridPreview = document.getElementById('gridPreview');
      const contadorCola = document.getElementById('contadorCola');
      const btnConfirmar = document.getElementById('btnConfirmarSubida');
      const btnCamara = document.getElementById('btnCamara');
      const btnVerAlbumInicial = document.getElementById('btnVerAlbumInicial');

      gridPreview.innerHTML = '';

      if (colaArchivos.length === 0) {
        seccionPreview.style.display = 'none';
        btnCamara.childNodes[0].nodeValue = '📷 Tomar foto ';
        btnVerAlbumInicial.style.display = 'block';
        return;
      }

      // Cambiar texto del botón de cámara para invitar a seguir tomando fotos
      btnCamara.childNodes[0].nodeValue = '📷 Tomar otra foto ';
      btnVerAlbumInicial.style.display = 'none';
      seccionPreview.style.display = 'block';

      contadorCola.innerText = `Fotos seleccionadas (${colaArchivos.length})`;
      btnConfirmar.innerText = colaArchivos.length === 1 
        ? '🚀 Subir 1 foto al álbum' 
        : `🚀 Subir ${colaArchivos.length} fotos al álbum`;

      colaArchivos.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'preview-item';

        const img = document.createElement('img');
        img.src = item.previewUrl;
        img.alt = `Vista previa ${index + 1}`;

        const btnDel = document.createElement('button');
        btnDel.type = 'button';
        btnDel.className = 'btn-remove';
        btnDel.innerHTML = '&times;';
        btnDel.setAttribute('aria-label', 'Eliminar foto');
        btnDel.onclick = () => eliminarDeCola(index);

        div.appendChild(img);
        div.appendChild(btnDel);
        gridPreview.appendChild(div);
      });
    }

    function reiniciarFormulario() {
      vaciarCola();
      document.getElementById('opcionesPostSubida').style.display = 'none';
      document.getElementById('controlesSeleccion').style.display = 'flex';
      document.getElementById('subtitulo').style.display = 'block';
      document.getElementById('barraContenedor').style.display = 'none';
      document.getElementById('barraProgreso').style.width = '0%';
      document.getElementById('estado').innerText = '';
      document.getElementById('detalleError').style.display = 'none';
    }

    async function subirColaCompleta() {
      if (colaArchivos.length === 0) return;

      const estado = document.getElementById('estado');
      const detalleError = document.getElementById('detalleError');
      const controlesSeleccion = document.getElementById('controlesSeleccion');
      const seccionPreview = document.getElementById('seccionPreview');
      const opcionesPostSubida = document.getElementById('opcionesPostSubida');
      const subtitulo = document.getElementById('subtitulo');
      const barraContenedor = document.getElementById('barraContenedor');
      const barraProgreso = document.getElementById('barraProgreso');

      // Ocultar selección y vista previa durante la subida
      controlesSeleccion.style.display = 'none';
      seccionPreview.style.display = 'none';
      subtitulo.style.display = 'none';
      detalleError.style.display = 'none';
      detalleError.innerText = '';
      
      barraContenedor.style.display = 'block';
      barraProgreso.style.width = '5%';

      const lote = [...colaArchivos];
      const total = lote.length;
      let completadas = 0;
      let errores = [];
      let indiceCola = 0;

      estado.innerText = `Preparando y subiendo ${total} foto(s)... ⚡`;

      async function trabajador() {
        while (indiceCola < total) {
          const idx = indiceCola++;
          const file = lote[idx].file;
          try {
            const base64Comprimido = await comprimirImagen(file);
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const baseName = file.name.replace(/\.[^/.]+$/, "");
            const nombreFinal = `${baseName}_${idx + 1}_${timestamp}.jpg`;

            const respuesta = await fetch(SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                base64Data: base64Comprimido,
                fileName: nombreFinal,
                mimeType: 'image/jpeg'
              })
            });

            const textoRespuesta = await respuesta.text();
            const resultado = JSON.parse(textoRespuesta);

            if (!resultado.exito) {
              throw new Error(resultado.error || 'Error en servidor.');
            }
          } catch (err) {
            errores.push(`${file.name}: ${err.message}`);
          } finally {
            completadas++;
            const porcentaje = Math.round((completadas / total) * 100);
            barraProgreso.style.width = `${porcentaje}%`;
            estado.innerText = `Subiendo: ${completadas} de ${total} (${porcentaje}%) ⏳`;
          }
        }
      }

      const numHilos = Math.min(SUBIDAS_SIMULTANEAS, total);
      const hilos = Array.from({ length: numHilos }, () => trabajador());
      await Promise.all(hilos);

      barraContenedor.style.display = 'none';

      if (errores.length > 0 && completadas === errores.length) {
        estado.innerText = `❌ No se pudieron subir las fotos.`;
        detalleError.style.display = 'block';
        detalleError.innerText = errores.join('\n');
        controlesSeleccion.style.display = 'flex';
        seccionPreview.style.display = 'block';
        return;
      }

      // Limpiar memoria de vistas previas tras subida exitosa
      vaciarCola();

      const exitosas = total - errores.length;
      estado.innerText = `✅ ¡Listo! Se subieron ${exitosas} de ${total} foto(s) al álbum.`;
      if (errores.length > 0) {
        detalleError.style.display = 'block';
        detalleError.innerText = `Algunas fotos fallaron:\n${errores.join('\n')}`;
      }
      opcionesPostSubida.style.display = 'flex';
    }

    function comprimirImagen(file) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        
        img.onload = function() {
          URL.revokeObjectURL(objectUrl);
          let width = img.width;
          let height = img.height;

          if (width > height && width > MAX_DIMENSION) {
            height = Math.round((height * MAX_DIMENSION) / width);
            width = MAX_DIMENSION;
          } else if (height > MAX_DIMENSION) {
            width = Math.round((width * MAX_DIMENSION) / height);
            height = MAX_DIMENSION;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL('image/jpeg', CALIDAD_JPEG));
        };

        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('No se pudo procesar la imagen.'));
        };

        img.src = objectUrl;
      });
    }
  </script>
</body>
</html>
