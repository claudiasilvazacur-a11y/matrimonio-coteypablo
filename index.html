<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Fotos al Álbum</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; color: #333; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 40px auto; }
    input[type="file"] { display: none; }
    .btn { background: #4285F4; color: white; padding: 15px 25px; border-radius: 8px; cursor: pointer; display: inline-block; font-size: 16px; font-weight: bold; margin-top: 15px; }
    #estado { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📸 Comparte tus fotos</h2>
    <p>Selecciona o toma una foto para subirla directamente al álbum.</p>
    <label class="btn">
      Elegir o tomar foto
      <input type="file" id="archivo" accept="image/*" multiple onchange="procesarArchivos()">
    </label>
    <div id="estado"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxYokVKO1njGjW4DODaNbHepRmf-WjNYxJKcj2-aLwpS6efo6VgKGHhakG51JA1WcbY/exec';

    async function procesarArchivos() {
      const input = document.getElementById('archivo');
      const estado = document.getElementById('estado');
      const archivos = Array.from(input.files);
      
      if (archivos.length === 0) return;
      estado.innerText = `Subiendo ${archivos.length} foto(s)... ⏳`;
      let subidas = 0;

      for (const file of archivos) {
        try {
          const base64Data = await leerArchivo(file);
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              base64Data: base64Data,
              fileName: file.name,
              mimeType: file.type
            })
          });
          subidas++;
          estado.innerText = `Subiendo (${subidas}/${archivos.length})... ⏳`;
        } catch (err) {
          estado.innerText = '❌ Error al subir: ' + err.message;
          return;
        }
      }

      estado.innerText = '✅ ¡Todas las fotos se subieron con éxito!';
      input.value = '';
    }

    function leerArchivo(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = e => reject(e);
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
