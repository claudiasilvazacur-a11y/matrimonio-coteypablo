<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería — Matrimonio Pablo y María José</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-crema: #FDF7F7;
      --rosa-suave: #F6E2E6;
      --rosa-borde: #EBC9D0;
      --rosa-principal: #D48195;
      --rosa-oscuro: #B86277;
      --salvia: #8FA691;
      --salvia-oscuro: #738C75;
      --texto-oscuro: #2C2A29;
      --texto-suave: #6D6566;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-crema);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(244, 198, 208, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(244, 198, 208, 0.25) 0%, transparent 40%);
      color: var(--texto-oscuro);
      margin: 0;
      padding: 15px;
    }

    .container { max-width: 920px; margin: 0 auto; padding-bottom: 45px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      padding: 12px 18px;
      border-radius: 16px;
      border: 1.5px solid var(--rosa-borde);
      box-shadow: 0 6px 20px rgba(184, 98, 119, 0.08);
      margin-bottom: 20px;
      position: sticky;
      top: 10px;
      z-index: 10;
      gap: 10px;
    }

    .topbar-title {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .topbar-title h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 30px;
      font-weight: 400;
      margin: 0;
      color: var(--texto-oscuro);
      line-height: 1.1;
    }

    .topbar-title span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--rosa-oscuro);
    }

    .btn-volver {
      background: var(--rosa-principal);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(212, 129, 149, 0.25);
      transition: background 0.2s;
    }
    .btn-volver:hover { background: var(--rosa-oscuro); }

    #estadoGaleria {
      text-align: center;
      color: var(--texto-suave);
      margin: 50px 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
    }
    
    /* Cuadrícula responsiva */
    .grid-galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    @media (min-width: 600px) {
      .grid-galeria { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    }

    .foto-item {
      position: relative;
      width: 100%;
      padding-top: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: var(--rosa-suave);
      border: 1px solid var(--rosa-borde);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(184, 98, 119, 0.06);
    }
    .foto-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.25s, opacity 0.3s; opacity: 0; }
    .foto-item img.cargada { opacity: 1; }
    .foto-item img:hover { transform: scale(1.05); }

    /* Paginación */
    .paginacion-box { text-align: center; margin-top: 28px; }
    .btn-cargar-mas {
      background: white;
      color: var(--rosa-oscuro);
      border: 1.5px solid var(--rosa-borde);
      padding: 12px 24px;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cargar-mas:hover { background: var(--rosa-suave); border-color: var(--rosa-principal); }
    .info-paginacion { font-size: 13px; color: var(--texto-suave); margin-top: 8px; }

    /* Visor ampliado */
    .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(32, 26, 28, 0.94); align-items: center; justify-content: center; flex-direction: column; gap: 14px; user-select: none; }
    .modal-header { position: absolute; top: 16px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; color: #F9DFE4; font-size: 15px; font-weight: 700; }
    .modal-close { font-size: 36px; cursor: pointer; line-height: 1; padding: 0 6px; color: white; }
    
    .modal-body { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 74%; }
    .modal-body img { max-width: 88%; max-height: 100%; border-radius: 10px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); object-fit: contain; border: 2px solid rgba(246, 226, 230, 0.25); }
    
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(246, 226, 230, 0.2); color: white; border: none; font-size: 24px; width: 46px; height: 46px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; backdrop-filter: blur(4px); }
    .nav-btn:hover { background: rgba(212, 129, 149, 0.65); }
    .nav-prev { left: 12px; }
    .nav-next { right: 12px; }

    .btn-descargar {
      background: var(--rosa-principal);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: background 0.2s;
    }
    .btn-descargar:hover { background: var(--rosa-oscuro); }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="topbar-title">
        <h2>Pablo y María José</h2>
        <span>🌸 <span id="totalFotos">0</span> recuerdos compartidos 🐾</span>
      </div>
      <a href="index.html" class="btn-volver">➕ Subir fotos</a>
    </div>

    <div id="estadoGaleria">Cargando recuerdos de nuestra boda... 🌸</div>
    <div class="grid-galeria" id="galeria"></div>

    <div class="paginacion-box" id="contenedorPaginacion" style="display: none;">
      <button class="btn-cargar-mas" id="btnCargarMas" onclick="renderizarSiguienteBloque()">🌸 Ver más recuerdos</button>
      <div class="info-paginacion" id="textoProgreso"></div>
    </div>
  </div>

  <!-- Visor ampliado -->
  <div class="modal" id="visorModal" onclick="cerrarModal()">
    <div class="modal-header" onclick="event.stopPropagation()">
      <span id="contadorModal">1 / 1</span>
      <span class="modal-close" onclick="cerrarModal()">&times;</span>
    </div>

    <div class="modal-body">
      <button class="nav-btn nav-prev" onclick="cambiarFoto(-1, event)" aria-label="Foto anterior">&#10094;</button>
      <img id="imagenAmpliada" src="" alt="Foto ampliada" onclick="event.stopPropagation()">
      <button class="nav-btn nav-next" onclick="cambiarFoto(1, event)" aria-label="Foto siguiente">&#10095;</button>
    </div>

    <a id="enlaceDescarga" href="#" class="btn-descargar" target="_blank" rel="noopener" onclick="event.stopPropagation()">
      ⬇️ Descargar recuerdo
    </a>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSjprB95VK-ywTb8fj1C9grSBJAL8L2amZ4GBZ5IigZduPtCMs-lBgivcYhLQBivlx/exec';
    const FOTOS_POR_BLOQUE = 24;

    let listaFotos = [];
    let fotosMostradas = 0;
    let indiceActual = 0;

    window.addEventListener('DOMContentLoaded', cargarListaDeFotos);

    window.addEventListener('scroll', () => {
      if (fotosMostradas >= listaFotos.length) return;
      const cercaDelFinal = (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 400);
      if (cercaDelFinal) {
        renderizarSiguienteBloque();
      }
    });

    document.addEventListener('keydown', function(e) {
      const modal = document.getElementById('visorModal');
      if (modal.style.display !== 'flex') return;
      if (e.key === 'ArrowLeft') cambiarFoto(-1);
      if (e.key === 'ArrowRight') cambiarFoto(1);
      if (e.key === 'Escape') cerrarModal();
    });

    async function cargarListaDeFotos() {
      const estado = document.getElementById('estadoGaleria');
      const total = document.getElementById('totalFotos');

      try {
        const respuesta = await fetch(SCRIPT_URL);
        const datos = await respuesta.json();

        if (!datos.exito) throw new Error(datos.error);

        listaFotos = datos.fotos;
        total.innerText = listaFotos.length;

        if (listaFotos.length === 0) {
          estado.innerText = 'Aún no hay fotos en nuestro álbum. ¡Pulsa "+ Subir fotos" para inaugurar los recuerdos! 🐾';
          return;
        }

        estado.style.display = 'none';
        renderizarSiguienteBloque();
      } catch (err) {
        estado.innerText = '❌ Error al cargar la galería: ' + err.message;
      }
    }

    function renderizarSiguienteBloque() {
      if (fotosMostradas >= listaFotos.length) return;

      const galeria = document.getElementById('galeria');
      const contenedorPag = document.getElementById('contenedorPaginacion');
      const btnCargarMas = document.getElementById('btnCargarMas');
      const textoProgreso = document.getElementById('textoProgreso');

      const limite = Math.min(fotosMostradas + FOTOS_POR_BLOQUE, listaFotos.length);
      const fragmento = document.createDocumentFragment();

      for (let i = fotosMostradas; i < limite; i++) {
        const foto = listaFotos[i];
        const div = document.createElement('div');
        div.className = 'foto-item';
        div.onclick = () => abrirModal(i);

        const img = document.createElement('img');
        img.src = `https://drive.google.com/thumbnail?id=${foto.id}&sz=w400`;
        img.alt = foto.nombre;
        img.loading = 'lazy';
        img.onload = () => img.classList.add('cargada');

        div.appendChild(img);
        fragmento.appendChild(div);
      }

      galeria.appendChild(fragmento);
      fotosMostradas = limite;

      contenedorPag.style.display = 'block';
      textoProgreso.innerText = `Mostrando ${fotosMostradas} de ${listaFotos.length} recuerdos`;

      if (fotosMostradas >= listaFotos.length) {
        btnCargarMas.style.display = 'none';
      } else {
        btnCargarMas.style.display = 'inline-block';
      }
    }

    function abrirModal(index) {
      indiceActual = index;
      actualizarVistaModal();
      document.getElementById('visorModal').style.display = 'flex';
    }

    function cambiarFoto(direccion, event) {
      if (event) event.stopPropagation();
      if (listaFotos.length === 0) return;

      indiceActual = (indiceActual + direccion + listaFotos.length) % listaFotos.length;
      actualizarVistaModal();
    }

    function actualizarVistaModal() {
      const foto = listaFotos[indiceActual];
      const img = document.getElementById('imagenAmpliada');
      const btnDescarga = document.getElementById('enlaceDescarga');
      const contador = document.getElementById('contadorModal');

      img.src = `https://drive.google.com/thumbnail?id=${foto.id}&sz=w1600`;
      btnDescarga.href = `https://drive.google.com/uc?export=download&id=${foto.id}`;
      btnDescarga.setAttribute('download', foto.nombre || 'recuerdo-boda.jpg');
      contador.innerText = `${indiceActual + 1} / ${listaFotos.length}`;
    }

    function cerrarModal() {
      document.getElementById('visorModal').style.display = 'none';
    }
  </script>
</body>
</html>
